<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>声呐异常复核与下水任务</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 24px; }
    h2 { font-size: 16px; margin: 14px 0 6px; }
    h3 { font-size: 14px; margin: 14px 0 6px; color: #5c7378; }
    button { border: 0; border-radius: 8px; padding: 9px 12px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button:hover:not(:disabled) { background: #16545e; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.secondary { background: #64777b; }
    button.secondary:hover { background: #526266; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #5c7378; font-size: 13px; }
    .app { display: grid; grid-template-columns: 1fr 420px; gap: 16px; padding: 16px; align-items: start; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .mapwrap { position: relative; }
    .map { position: relative; height: calc(100vh - 128px); min-height: 560px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; padding: 0; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.8); }
    .marker.proposed { border-style: dashed; }
    .marker.md { opacity: .45; }
    .marker.proposed::after { content: ""; position: absolute; inset: -6px; border: 2px solid #ffc24d; border-radius: 50%; animation: pulse 1.4s ease-out infinite; }
    @keyframes pulse { 0% { opacity: .9; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.35); } }
    .conf-h { background: #b54b38; } .conf-m { background: #1d6c78; } .conf-l { background: #7a6ca6; }
    .legend { position: absolute; left: 12px; bottom: 12px; background: rgba(7,51,63,.82); color: #e7f2f3; border-radius: 8px; padding: 8px 10px; font-size: 12px; display: grid; gap: 4px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,.7); }
    .dot.proposed { border: 2px dashed #ffc24d; background: transparent; }
    .dot.dismissed { opacity: .45; }
    .tabs { display: flex; gap: 8px; }
    .tab { flex: 1; background: #dfeaeb; color: #1d6c78; }
    .tab.active { background: #1d6c78; color: #fff; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
    .row button { flex: 1; min-width: 96px; padding: 8px 10px; font-size: 13px; }
    .toolbar { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
    .list { display: grid; gap: 8px; max-height: 46vh; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .item-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 3px; }
    .muted { color: #5c7378; font-size: 13px; }
    .logline { margin-top: 6px; font-size: 12px; border-top: 1px dashed #d7e4e5; padding-top: 5px; }
    .empty { padding: 12px; text-align: center; border: 1px dashed #c9dadc; border-radius: 8px; }
    .pill { display: inline-block; padding: 2px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; color: #345056; background: #f3f8f8; }
    .pill.conf-h { background: #fbe6e1; color: #8f311f; border-color: #eabbb0; }
    .pill.conf-m { background: #e1f0f2; color: #1d6c78; border-color: #b9d9dd; }
    .pill.conf-l { background: #ece9f6; color: #574a86; border-color: #cfc9e8; }
    .st-pending { background: #fff3da; color: #8a5a12; border-color: #f0d59a; }
    .st-confirmed { background: #e2f4e6; color: #1d6c3a; border-color: #b8e0c3; }
    .st-dismissed { background: #eceff0; color: #64777b; border-color: #d2dbdc; }
    .t-open { background: #e1f0f2; color: #1d6c78; border-color: #b9d9dd; }
    .t-diving { background: #e2f4e6; color: #1d6c3a; border-color: #b8e0c3; }
    .t-withdrawn { background: #f4e6e6; color: #8a2f2f; border-color: #e0bcbc; }
    .revbox { margin-top: 8px; padding: 9px; background: #fffaf0; border: 1px solid #f0d59a; border-radius: 8px; }
    .revbox .chg { color: #8a5a12; font-size: 13px; font-weight: 700; }
    #taskView { display: none; }
    .app.show-tasks #reviewView { display: none; }
    .app.show-tasks #taskView { display: block; }
    #toast { position: fixed; top: 16px; left: 50%; transform: translate(-50%, -16px); background: #14393f; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; max-width: 80vw; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 10; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.warn { background: #8a5a12; }
    @media (max-width: 980px) { header { display: block; } .app { grid-template-columns: 1fr; } .map { height: 460px; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>声呐异常复核与下水任务</h1>
      <div class="muted">声呐筛出异常目标 → 复核台登记判定 → 复核过后生成下水任务。同线同编号重传沿用首次结果，资料变化先待复核。</div>
    </div>
    <button id="exportBtn">导出JSON</button>
  </header>

  <main class="app" id="app">
    <section class="panel mapwrap">
      <div class="map" id="map">
        <div class="wreck"></div>
        <div class="rib" style="left:28%"></div><div class="rib" style="left:35%"></div><div class="rib" style="left:42%"></div>
        <div class="rib" style="left:49%"></div><div class="rib" style="left:56%"></div><div class="rib" style="left:63%"></div><div class="rib" style="left:70%"></div>
        <div class="legend">
          <span><i class="dot conf-h"></i>高置信</span>
          <span><i class="dot conf-m"></i>中置信</span>
          <span><i class="dot conf-l"></i>低置信</span>
          <span><i class="dot proposed"></i>新资料待复核</span>
          <span><i class="dot conf-m dismissed"></i>已排除</span>
          <span class="muted" style="color:#cfe4e6">点击平面图可取坐标</span>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="tabs">
        <button type="button" class="tab" data-tab="review">复核台</button>
        <button type="button" class="tab" data-tab="tasks">下水任务</button>
      </div>

      <div id="reviewView">
        <form id="intakeForm">
          <h2>声呐回传登记</h2>
          <div class="grid2">
            <div><label>测线号</label><input id="f-line" placeholder="例如 L-03" required></div>
            <div><label>目标编号</label><input id="f-target" placeholder="例如 S-017" required></div>
          </div>
          <div class="grid2">
            <div><label>坐标 X（%）</label><input id="f-x" type="number" step="0.1" min="0" max="100" required></div>
            <div><label>坐标 Y（%）</label><input id="f-y" type="number" step="0.1" min="0" max="100" required></div>
          </div>
          <label>置信等级</label>
          <select id="f-confidence"><option>高</option><option selected>中</option><option>低</option></select>
          <div class="row"><button>登记 / 重传</button></div>
        </form>

        <div class="toolbar">
          <select id="contactFilter">
            <option value="">全部状态</option>
            <option value="pending">待复核</option>
            <option value="confirmed">已确认</option>
            <option value="dismissed">已排除</option>
          </select>
        </div>
        <h2>接触点列表</h2>
        <div id="contactList" class="list"></div>
      </div>

      <div id="taskView">
        <form id="taskForm">
          <h2>生成下水任务</h2>
          <label>接触点（复核确认后可生成）</label>
          <select id="t-contact"></select>
          <div class="grid2">
            <div><label>潜次</label><input id="t-dive" placeholder="例如 DIVE-05" required></div>
            <div><label>申报人</label><input id="t-applicant" placeholder="申报人姓名" required></div>
          </div>
          <div class="row"><button>生成任务</button></div>
        </form>
        <h3>未结束任务（同一接触点仅一条；测线/坐标改动自动重排）</h3>
        <div id="openList" class="list"></div>
        <h3>已结束（已下潜留档 / 已撤回）</h3>
        <div id="doneList" class="list"></div>
      </div>
    </aside>
  </main>

  <div id="toast"></div>

  <script src="judgment.js"></script>
  <script src="tasks.js"></script>
  <script src="page.js"></script>
</body>
</html>
